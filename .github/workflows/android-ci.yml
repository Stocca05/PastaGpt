name: Android CI # Names the workflow shown in GitHub and the README badge.

on: # Runs the same local checks whenever repository code is updated.
  push: # Checks pushed branches and tags.
  pull_request: # Checks proposed changes before review or merge.
  workflow_dispatch: # Allows an explicit manual run from GitHub.

permissions:
  contents: read # The build needs to read source, not modify the repository.

jobs:
  verify:
    runs-on: ubuntu-latest # Uses a hosted Linux runner without starting an emulator.
    timeout-minutes: 30 # Bounds dependency downloads and compilation.
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, verified from the official release on 2026-10-12.
        with:
          persist-credentials: false # The build does not need to push or change repository settings.

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1, verified from the official release on 2026-10-12.
        with:
          distribution: temurin # Matches the compatible local Java runtime.
          java-version: '17' # Matches the project's daemon and JVM target.

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4, verified from the official release on 2026-10-12.

      - name: Install the declared Android platform
        run: sdkmanager "platforms;android-35" "platform-tools" # Matches compileSdk 35; Gradle can install its required build tools under accepted SDK licences.

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0, verified from the official release on 2026-10-12.

      - name: Build, unit tests, lint and instrumentation compilation
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest --console=plain --no-daemon # Compiles device tests without executing them or calling Gemini.
